title: Jinger Chong
contact_email: jinger [at] mit.edu
description: Portfolio
cv_url: /downloads/jinger-chong-cv.pdf

baseurl: ""
url: "https://jingerchong.com"
logo: /assets/logo.webp
banner: /assets/banner.webp
headshot: /assets/headshot.webp

theme: minima
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  sass_dir: _sass

collections:
  projects:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - AGENTS.md
  - TODO.md
  - examples
  - vendor
  - assets/images/abes-outreach
