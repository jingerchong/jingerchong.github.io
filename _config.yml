title: Jinger Chong
contact_email: jinger@mit.edu
tagline: Human intent prediction · Autonomous navigation
# Status tag in the homepage hero. Leave empty to hide it (e.g. after accepting an offer).
status: Open to Summer 2027 research internships
description: Portfolio
cv_url: /downloads/jinger-chong-cv.pdf

baseurl: ""
url: "https://jingerchong.com"
logo: /assets/logo.webp
banner: /assets/banner.webp
headshot: /assets/headshot.webp

theme: minima
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  sass_dir: _sass

collections:
  projects:
    output: true
    permalink: /projects/:slug/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/banner.webp
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - AGENTS.md
  - TODO.md
  - examples
  - vendor
  - Claude outputs
  - "*.psd"
