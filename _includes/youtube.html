{% if include.id and include.id != '' %}<figure class="video-figure"><div class="video-embed"><iframe src="https://www.youtube-nocookie.com/embed/{{ include.id | escape }}" title="{{ include.title | default: page.title | escape }}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>{% if include.caption %}<figcaption class="small">{{ include.caption }}</figcaption>{% endif %}</figure>{% endif %}
