<div class="service-list">
  {% assign services = site.data.service | sort: "datetime" | reverse %}
  {% for item in services %}
    <article class="service-entry">
      <div class="service-title-row">
        <h3>
          {% capture service_label %}<span class="service-role">{{ item.role }}, </span><span class="service-organization">{{ item.organization }}</span>{% endcapture %}
          {% if item.writeup %}<a href="{{ item.writeup | relative_url }}"{% if item.writeup contains '://' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ service_label }}</a>{% else %}{{ service_label }}{% endif %}
        </h3>
        <time{% if item.datetime %} datetime="{{ item.datetime }}"{% endif %}>{{ item.date }}</time>
      </div>
    </article>
  {% endfor %}
</div>
