<article class="content-card"><div class="card-media">{% if include.item.cover %}<img loading="lazy" src="{{ include.item.cover | relative_url }}" alt="{{ include.item.title | escape }}">{% else %}<img loading="lazy" src="/assets/placeholder.svg" alt="Media placeholder">{% endif %}</div><div class="card-body"><h3>{% if include.item.url %}<a href="{{ include.item.url | relative_url }}">{% endif %}{{ include.item.title | escape }}{% if include.item.url %}</a>{% endif %}</h3>{% if include.item.headline %}<p>{{ include.item.headline }}</p>{% elsif include.item.blurb %}<p>{{ include.item.blurb }}</p>{% endif %}</div></article>
