<div class="resume">
    <div class="resume-col-1">
        <h3>{{ page.title }}</h3>
        {% if page.link %}<a href="{{ page.link }}"><h4>{{ page.subtitle }}</h4></a>{% else %}<h4>{{ page.subtitle }}</h4>{% endif %}
        <div class="duration">{{ page.duration }}</div>
        <div class="location">{{ page.location }}</div>
    </div>
    <div class="resume-col-2">
        {{ page.content }}
    </div>
</div>
