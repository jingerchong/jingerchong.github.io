---
layout: default
---

<div>
    <div class="archive-group">
    <h2><a href="{{ page.url }}">{{ page.title }}</a></h2>
    <ul class="post-list">
        {% assign posts = site.posts | where: 'area', page.title | sort: 'date' | reverse %}
        {% for post in posts %}
          {% include post-card.html post=post %}
        {%- endfor -%}
    </ul>
    </div>
</div>
